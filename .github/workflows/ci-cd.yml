name: CI/CD Pipeline

# CI (lint, test, Terraform validate) — always runs on every push and PR.
# CD (ephemeral test env + prod deploy) — requires DEPLOY_ENABLED=true in repo variables.
# Set DEPLOY_ENABLED: GitHub repo → Settings → Variables → Actions → New repository variable

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: "3.12"
  AWS_REGION: eu-west-1

jobs:

  # ── CI ───────────────────────────────────────────────────────────────────────

  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 mypy pytest pytest-cov

      - name: Format check (black)
        run: black --check app/ tests/

      - name: Lint (flake8)
        run: flake8 app/ tests/ --max-line-length=100

      - name: Type check (mypy)
        run: mypy app/src/ --ignore-missing-imports
        continue-on-error: true

      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/integration_test.py --cov=app/src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docs-check:
    name: Docs Updated With Code
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check .md files updated alongside app/src/ changes
        run: |
          COMMIT_MSG=$(git log -1 --format="%s")
          PYTHON_CHANGED=$(git diff --name-only HEAD~1 HEAD | grep 'app/src/.*\.py' || true)
          MD_CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '\.md$' || true)

          if [ -z "$PYTHON_CHANGED" ]; then
            echo "No app/src/ Python files changed — skipping"
            exit 0
          fi
          if echo "$COMMIT_MSG" | grep -q '^style:'; then
            echo "Style commit — skipping"
            exit 0
          fi
          if [ -z "$MD_CHANGED" ]; then
            echo "ERROR: app/src/ Python changed but no .md files updated"
            echo "Changed: $PYTHON_CHANGED"
            echo "Update README.md, ARCHITECTURE.md, DEPLOYMENT.md, API.md as needed."
            echo "If no doc updates needed, start commit message with 'style:'"
            exit 1
          fi
          echo "Doc check passed"

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Format Check
        run: |
          cd infra/terraform
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform validate

  # ── CD: Build ────────────────────────────────────────────────────────────────

  build-lambda:
    name: Build and Upload Lambda Package
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    outputs:
      s3_key: ${{ steps.upload.outputs.s3_key }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build Lambda package
        run: |
          mkdir -p lambda_build
          pip install -r requirements.txt -t lambda_build/ --quiet
          cp -r app lambda_build/
          cp -r config lambda_build/
          cd lambda_build && zip -r ../lambda_function.zip . -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        id: upload
        run: |
          S3_KEY="lambda-packages/${{ github.run_id }}/lambda_function.zip"
          aws s3 cp lambda_function.zip \
            s3://${{ vars.TF_STATE_BUCKET }}/${S3_KEY}
          echo "s3_key=${S3_KEY}" >> $GITHUB_OUTPUT

  # ── CD: Ephemeral test environment ───────────────────────────────────────────

  ephemeral-test:
    name: Ephemeral Test Environment
    runs-on: ubuntu-latest
    needs: [build-lambda, terraform-validate]
    if: vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    env:
      ENV_NAME: test-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: |
          cd infra/terraform
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.ENV_NAME }}/terraform.tfstate"

      - name: Terraform Apply
        run: |
          cd infra/terraform
          terraform apply -auto-approve \
            -var-file=terraform.test.tfvars \
            -var="environment=${{ env.ENV_NAME }}" \
            -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" \
            -var="lambda_s3_bucket=${{ vars.TF_STATE_BUCKET }}" \
            -var="lambda_s3_key=${{ needs.build-lambda.outputs.s3_key }}"

      - name: Set up Python for integration test
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: pip install boto3 --quiet

      - name: Run integration test
        run: |
          python tests/integration_test.py \
            --function-name "news-aggregator-${{ env.ENV_NAME }}" \
            --table-name "news-aggregator-${{ env.ENV_NAME }}-articles" \
            --region ${{ env.AWS_REGION }}

      - name: Terraform Destroy
        if: always()
        run: |
          cd infra/terraform
          terraform destroy -auto-approve \
            -var-file=terraform.test.tfvars \
            -var="environment=${{ env.ENV_NAME }}" \
            -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" \
            -var="lambda_s3_bucket=${{ vars.TF_STATE_BUCKET }}" \
            -var="lambda_s3_key=${{ needs.build-lambda.outputs.s3_key }}"

      - name: Clean up S3 state
        if: always()
        run: |
          aws s3 rm s3://${{ vars.TF_STATE_BUCKET }}/${{ env.ENV_NAME }}/ --recursive || true

  # ── CD: Production deployment ─────────────────────────────────────────────────

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ephemeral-test, build-lambda]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: |
          cd infra/terraform
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate"

      - name: Terraform Apply
        run: |
          cd infra/terraform
          terraform apply -auto-approve \
            -var-file=terraform.prod.tfvars \
            -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" \
            -var="slack_webhook_tech=${{ secrets.SLACK_WEBHOOK_TECH }}" \
            -var="slack_webhook_ai=${{ secrets.SLACK_WEBHOOK_AI }}" \
            -var="slack_webhook_education=${{ secrets.SLACK_WEBHOOK_EDUCATION }}" \
            -var="slack_webhook_cyber_security=${{ secrets.SLACK_WEBHOOK_CYBER_SECURITY }}" \
            -var="lambda_s3_bucket=${{ vars.TF_STATE_BUCKET }}" \
            -var="lambda_s3_key=${{ needs.build-lambda.outputs.s3_key }}"

      - name: Notify deployment
        if: always()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {"payload": "News Aggregator deployed to prod — ${{ job.status }} (${{ github.actor }}, ${{ github.sha }})"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOYMENT_WEBHOOK }}
