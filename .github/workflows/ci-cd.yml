name: CI/CD Pipeline

# CI (lint, test, Terraform validate) runs on every push and PR.
# CD (build, deploy) only runs when the DEPLOY_ENABLED repository variable is set to 'true'.
# Set DEPLOY_ENABLED in: GitHub repo → Settings → Variables → Actions → New repository variable

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: "3.12"
  AWS_REGION: eu-west-1

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 mypy pytest pytest-cov

      - name: Format check (black)
        run: black --check app/ tests/

      - name: Lint (flake8)
        run: flake8 app/ tests/ --max-line-length=100

      - name: Type check (mypy)
        run: mypy app/src/ --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --cov=app/src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Format Check
        run: |
          cd infra/terraform
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform validate

  build-lambda:
    name: Build Lambda Package
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Lambda deployment package
        run: |
          mkdir -p lambda_build
          pip install -r requirements.txt -t lambda_build/
          cp -r app lambda_build/
          cp -r config lambda_build/
          cd lambda_build
          zip -r ../lambda_function.zip .

      - name: Upload Lambda package
        uses: actions/upload-artifact@v3
        with:
          name: lambda-package
          path: lambda_function.zip
          retention-days: 7

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [terraform-validate]
    if: |
      github.event_name == 'pull_request' &&
      vars.DEPLOY_ENABLED == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: |
          cd infra/terraform
          terraform init

      - name: Terraform Plan (Dev)
        id: plan
        run: |
          cd infra/terraform
          terraform plan -var-file=terraform.dev.tfvars -out=tfplan_dev -no-color 2>&1 | tee tfplan_dev.txt
        continue-on-error: true

      - name: Comment PR with plan
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/tfplan_dev.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n... (truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`\n${truncated}\n\`\`\``
            });

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-lambda]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: |
          cd infra/terraform
          terraform init

      - name: Terraform Plan (Prod)
        run: |
          cd infra/terraform
          terraform plan \
            -var-file=terraform.prod.tfvars \
            -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" \
            -var="slack_webhook_tech=${{ secrets.SLACK_WEBHOOK_TECH }}" \
            -var="slack_webhook_ai=${{ secrets.SLACK_WEBHOOK_AI }}" \
            -var="slack_webhook_education=${{ secrets.SLACK_WEBHOOK_EDUCATION }}" \
            -var="slack_webhook_cyber_security=${{ secrets.SLACK_WEBHOOK_CYBER_SECURITY }}" \
            -out=tfplan_prod

      - name: Terraform Apply (Prod)
        run: |
          cd infra/terraform
          terraform apply -auto-approve tfplan_prod

  deploy-lambda:
    name: Deploy Lambda Function
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Lambda package
        uses: actions/download-artifact@v3
        with:
          name: lambda-package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name news-aggregator \
            --zip-file fileb://lambda_function.zip \
            --region ${{ env.AWS_REGION }}

      - name: Wait for update
        run: sleep 5

      - name: Run health check
        run: |
          aws lambda invoke \
            --function-name news-aggregator \
            --payload '{}' \
            --region ${{ env.AWS_REGION }} \
            response.json
          cat response.json

  notify-deployment:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-lambda]
    if: always() && vars.DEPLOY_ENABLED == 'true'

    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "News Aggregator Deployment: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "News Aggregator Deployment\nStatus: ${{ job.status }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOYMENT_WEBHOOK }}
